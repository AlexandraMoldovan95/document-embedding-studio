[project]
name = "document-embedding-studio-backend"
version = "1.0.0"
description = "Document ingestion, chunking, embedding, and ChromaDB storage."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "chromadb>=0.5.20",
  "sentence-transformers>=3.3",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "httpx>=0.27",
  "docker>=7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
